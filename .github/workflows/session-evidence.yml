name: Session Evidence (temporary — remove after debugging)

on:
  workflow_dispatch:

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gather read-only evidence
        run: node script/session-evidence.mjs 2>&1 | tee evidence.log
