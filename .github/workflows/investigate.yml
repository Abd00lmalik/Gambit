name: On-chain investigation

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch: {}

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install viem
        run: npm install --no-audit --no-fund
      - name: Run investigation
        run: node script/investigate-duel.mjs
