name: Gambit CI

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install viem
        run: npm install --no-audit --no-fund
      - name: Run investigation
        run: |
          node script/investigate-duel.mjs 2>&1 | tee investigation-report.md
          node script/investigate-resolution.mjs 2>&1 | tee investigation-resolution.md || true
      - name: Commit reports via Contents API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit_file() {
            local f="$1"
            local b64 sha payload
            b64=$(base64 -w0 "$f")
            sha=$(gh api "repos/${{ github.repository }}/contents/$f?ref=${{ github.ref }}" --jq .sha 2>/dev/null || echo "")
            if [ -n "$sha" ]; then
              payload=$(jq -n --arg msg "ci: report $f [skip ci]" --arg b "$b64" --arg sha "$sha" '{message:$msg, content:$b, sha:$sha, branch:"${{ github.ref_name }}"}')
            else
              payload=$(jq -n --arg msg "ci: report $f [skip ci]" --arg b "$b64" '{message:$msg, content:$b, branch:"${{ github.ref_name }}"}')
            fi
            gh api -X PUT "repos/${{ github.repository }}/contents/$f" --input - <<< "$payload" > /dev/null && echo "committed $f"
          }
          commit_file investigation-report.md
          commit_file investigation-resolution.md

  forge-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install node deps (OZ remapping target)
        run: npm install --no-audit --no-fund
      - name: Run forge tests
        run: forge test -vvv 2>&1 | tee forge-test.log
      - name: Commit test log via Contents API
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          b64=$(base64 -w0 forge-test.log)
          sha=$(gh api "repos/${{ github.repository }}/contents/forge-test.log?ref=${{ github.ref }}" --jq .sha 2>/dev/null || echo "")
          if [ -n "$sha" ]; then
            payload=$(jq -n --arg msg "ci: forge test log [skip ci]" --arg b "$b64" --arg sha "$sha" '{message:$msg, content:$b, sha:$sha, branch:"${{ github.ref_name }}"}')
          else
            payload=$(jq -n --arg msg "ci: forge test log [skip ci]" --arg b "$b64" '{message:$msg, content:$b, branch:"${{ github.ref_name }}"}')
          fi
          gh api -X PUT "repos/${{ github.repository }}/contents/forge-test.log" --input - <<< "$payload" > /dev/null && echo "committed forge-test.log"

  deploy:
    # Runs only when the commit message contains [deploy] AND tests passed.
    needs: forge-test
    if: ${{ contains(github.event.head_commit.message, '[deploy]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RPC: https://api.infra.testnet.somnia.network
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install node deps (OZ remapping target)
        run: npm install --no-audit --no-fund
      - name: Extract testnet deployer key from handoff doc
        run: |
          # Testnet-only keys, deliberately committed in Gambit/handoff.md by the repo owner.
          PK=$(grep -oP '0x[0-9a-fA-F]{64}' Gambit/handoff.md | sed -n '1p')  # Player A / Owner (45+ STT)
          echo "Derived deployer address:"
          PRIVKEY="$PK" node -e '
            import("viem/accounts").then(async ({ privateKeyToAccount }) => {
              const acct = privateKeyToAccount(process.env.PRIVKEY);
              console.log(acct.address);
            });' > deployer.txt
          cat deployer.txt
          echo "DEPLOYER_PK=$PK" >> $GITHUB_ENV
      - name: Check deployer balance
        run: |
          DEPLOYER=$(cat deployer.txt)
          PRIVKEY="$DEPLOYER_PK" DEPLOYER="$DEPLOYER" node -e '
            import("viem").then(async ({ createPublicClient, http, formatEther }) => {
              const c = createPublicClient({ transport: http(process.env.RPC) });
              const bal = await c.getBalance({ address: process.env.DEPLOYER });
              console.log("balance:", formatEther(bal), "STT");
              if (bal < 2000000000000000000n) { console.log("::error::deployer needs >= 2 STT gas"); process.exit(1); }
            });'
      - name: Deploy V30 (side support + hardened settle) + on-chain smoke
        run: set -o pipefail; FACTORY_ADDRESS=0xea5f3130a5ed09929da3e156ec0308c58de6a2e1 node script/deploy-v30.mjs 2>&1 | tee deploy-v30.log
      - name: Verify creation works on 3 live markets (P0)
        run: set -o pipefail; node script/verify-creation.mjs 2>&1 | tee verify-creation.log
      - name: Commit creation-verification log via Contents API
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch verify-creation.log
          b64=$(base64 -w0 verify-creation.log)
          sha=$(gh api "repos/${{ github.repository }}/contents/verify-creation.log?ref=${{ github.ref }}" --jq .sha 2>/dev/null || echo "")
          if [ -n "$sha" ]; then
            payload=$(jq -n --arg msg "ci: creation verification [skip ci]" --arg b "$b64" --arg sha "$sha" '{message:$msg, content:$b, sha:$sha, branch:"${{ github.ref_name }}"}')
          else
            payload=$(jq -n --arg msg "ci: creation verification [skip ci]" --arg b "$b64" '{message:$msg, content:$b, branch:"${{ github.ref_name }}"}')
          fi
          gh api -X PUT "repos/${{ github.repository }}/contents/verify-creation.log" --input - <<< "$payload" > /dev/null && echo "committed verify-creation.log"
      - name: Redact smoke log (strip tx hashes + private details)
        run: sed -E 's/0x[0-9a-f]{64}/<txhash>/g' deploy-v30.log > deploy-v30.redacted.log && mv deploy-v30.redacted.log deploy-v30.log
      - name: Commit deploy log via Contents API
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch deploy-v30.log
          b64=$(base64 -w0 deploy-v30.log)
          sha=$(gh api "repos/${{ github.repository }}/contents/deploy-v30.log?ref=${{ github.ref }}" --jq .sha 2>/dev/null || echo "")
          if [ -n "$sha" ]; then
            payload=$(jq -n --arg msg "ci: deploy log [skip ci]" --arg b "$b64" --arg sha "$sha" '{message:$msg, content:$b, sha:$sha, branch:"${{ github.ref_name }}"}')
          else
            payload=$(jq -n --arg msg "ci: deploy log [skip ci]" --arg b "$b64" '{message:$msg, content:$b, branch:"${{ github.ref_name }}"}')
          fi
          gh api -X PUT "repos/${{ github.repository }}/contents/deploy-v30.log" --input - <<< "$payload" > /dev/null && echo "committed deploy-v30.log"
