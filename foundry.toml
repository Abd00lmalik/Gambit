[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=Gambit/node_modules/@openzeppelin/contracts/",
    "forge-std/=Gambit/lib/forge-std/src/",
]

[rpc_endpoints]
somnia = "https://api.infra.testnet.somnia.network"

[etherscan]
somnia = { key = "api-key", url = "https://shannon-explorer.somnia.network" }
