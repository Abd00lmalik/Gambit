name: On-chain investigation

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch: {}

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install viem
        run: npm install --no-audit --no-fund
      - name: Run investigation
        run: |
          node script/investigate-duel.mjs 2>&1 | tee investigation-report.md
      - name: Commit report back to branch
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add investigation-report.md
          git commit -m "ci: investigation report [skip ci]"
          git push origin arena/01a08b4d-gambit
